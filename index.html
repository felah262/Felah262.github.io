        <!-- Dropdown menu -->
<div style="position: top; left: inline-block; font-family: Arial, sans-serif;">

  <button onclick="toggleDropdown()" 
          style="background-color: #d82c2c; color: white; padding: 12px 20px; 
                 border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">
    Menu ▾
  </button>

  <div id="dropdownMenu" 
       style="display: none; position: absolute; top: 80%; left: 50; 
              background-color: rgb(14, 13, 13); min-width: 180px; 
              box-shadow: 0 8px 16px rgba(197, 41, 41, 0.15); 
              border-radius: 8px; margin-top: 6px; overflow: hidden; 
              z-index: 1000;">

    <a href="index.html" 
       style="display: block; padding: 12px 16px; color: #f0eded; 
              text-decoration: none;">
      Home
    </a>

    <a href="binairstelsel.html"
    style="display: block; padding: 12px 16px; color: #f0eded; 
              text-decoration: none;">
       Informatie 
    </a>

  </div>
</div>

<script>
function toggleDropdown() {
  const menu = document.getElementById("dropdownMenu");

  if (menu.style.display === "block") {
    menu.style.display = "none";
  } else {
    menu.style.display = "block";
  }
}

// Sluit het menu als je ergens anders klikt
document.addEventListener("click", function(event) {
  const dropdown = event.target.closest("#dropdownMenu");
  const button = event.target.closest("button");

  if (!dropdown && !button) {
    document.getElementById("dropdownMenu").style.display = "none";
  }
});
</script>
